plugins { id 'com.android.application' }

// Never commit signing keys. CI injects the private keystore from encrypted
// GitHub Actions secrets only when all four values are present.
def signingFile = System.getenv('VS_SIGNING_STORE_FILE')
def signingPassword = System.getenv('VS_SIGNING_STORE_PASSWORD')
def signingAlias = System.getenv('VS_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('VS_SIGNING_KEY_PASSWORD')
def hasStableSigning = [signingFile, signingPassword, signingAlias, signingKeyPassword]
    .every { it != null && !it.isEmpty() }

android {
    namespace 'fr.validatesteps'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.validatesteps'
        minSdk 34
        targetSdk 35
        versionCode 20
        versionName '0.20.0'
    }
    signingConfigs {
        if (hasStableSigning) {
            stableRelease {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasStableSigning) signingConfig signingConfigs.stableRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.12.0'
    testImplementation 'junit:junit:4.13.2'
}
