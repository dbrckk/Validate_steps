name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_signed:
        description: "Require a signed APK using protected repository secrets"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no Accessibility-driven third-party automation
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'BIND_ACCESSIBILITY_SERVICE|android.accessibilityservice.AccessibilityService' app/src/main/AndroidManifest.xml; then
            echo "::error::Unattended release must not declare AccessibilityService."
            exit 1
          fi
          echo "No AccessibilityService is declared."
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK and install platform
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and test
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease
      - name: Verify installable debug APK and write SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: validate-steps-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - name: Prepare stable signing key on trusted main builds
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VS_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.VS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$SIGNING_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured: only a debug APK is available."
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_signed }}" == "true" ]]; then
              echo "::error::A signed release was requested but the four signing secrets are missing."
              exit 1
            fi
            exit 0
          fi
          signing_file="$RUNNER_TEMP/validate-steps-private.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          chmod 600 "$signing_file"
          test -s "$signing_file"
          echo "VS_SIGNING_STORE_FILE=$signing_file" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build and verify stable signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          VS_SIGNING_STORE_PASSWORD: ${{ secrets.VS_KEYSTORE_PASSWORD }}
          VS_SIGNING_KEY_ALIAS: ${{ secrets.VS_KEY_ALIAS }}
          VS_SIGNING_KEY_PASSWORD: ${{ secrets.VS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Publish stable signed release (if configured)
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validate-steps-release-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
